    git_url:
    description: Developed a complete Business Intelligence solution using SSIS for multi-source ETL (AdventureWorks), built an OLAP cube with SSAS for multidimensional sales analysis (drill-down by region, product, and period), and created automated Power BI performance reports enabling comparative sales analysis by segment.

  - name: "Exploratory Analysis  Dimensionality Reduction & Clustering"
    git_url:
    description: Analyzed multiple datasets (CarSales, TemperatureFrance, Iris) using IBM SPSS and RStudio. Applied Principal Component Analysis (PCA) to reduce dimensionality and identify key variables, then implemented K-Means and hierarchical clustering (CHA) algorithms to segment observations and extract meaningful patterns.

