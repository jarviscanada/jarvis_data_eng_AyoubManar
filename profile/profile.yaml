# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Architected a lightweight, agent-based monitoring solution for Linux clusters that provides real-time operational visibility. By orchestrating Bash-based telemetry and containerized PostgreSQL persistence via Docker, the system automates continuous hardware and resource utilization tracking. This streamlined, dependency-free framework replaces heavyweight enterprise tools, enabling proactive capacity planning and anomaly detection through structured SQL analysis."
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Developed a Python-based data analytics proof-of-concept for LGS, a retail company, to transition from intuition-based to data-driven decision-making. Utilized Pandas for data wrangling and transformation, SQLAlchemy for PostgreSQL database connectivity, and Matplotlib/Seaborn for exploratory data analysis. Implemented RFM (Recency, Frequency, Monetary) modeling to segment customers, enabling targeted marketing strategies and improved revenue growth."

